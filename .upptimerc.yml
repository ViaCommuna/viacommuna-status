# Upptime config for the public status page (repo: ViaCommuna/viacommuna-status).
# Copy to .upptimerc.yml in that repo. Upptime runs on GitHub Actions and
# publishes to GitHub Pages: open source (MIT), no server, free for public repos.
owner: ViaCommuna
repo: viacommuna-status

sites:
  - name: Website
    url: https://www.viacommuna.com
  - name: Admin-Dashboard
    url: https://admin.viacommuna.com
    # The root redirects to /login (307); count that as up.
    expectedStatusCodes:
      - 200
      - 307
  - name: API & Login (Supabase)
    url: https://hdooeficjgsfqiyatess.supabase.co/auth/v1/health
    headers:
      # Publishable anon key (already shipped in the app bundle), stored as a
      # repository secret so it isn't committed.
      - "apikey: $SUPABASE_ANON_KEY"

status-website:
  # Served at https://viacommuna.github.io/viacommuna-status until a
  # status.viacommuna.com CNAME is set up.
  baseUrl: /viacommuna-status
  name: Via Communa Status
  introTitle: "Via Communa – Systemstatus"
  introMessage: Aktuelle Verfügbarkeit und Störungen der Via Communa App und des Admin-Dashboards.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

i18n:
  activeIncidents: Aktive Störungen
  allSystemsOperational: Alle Systeme funktionieren
  incidentReport: "Störungsbericht #$NUMBER →"
  pastIncidents: Vergangene Störungen
  pastIncidentsResolved: "Behoben in $MINUTES Minuten mit $POSTS Updates"
  up: Verfügbar
  down: Ausfall
  degraded: Eingeschränkt

workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "0 23 * * *"
  graphs: "0 0 * * *"
  summary: "0 0 * * *"
  staticSite: "0 1 * * *"
  updates: "0 3 * * 0"
  updateTemplate: "0 0 * * *"
